name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.300'

      - name: Pin .NET SDK version
        run: echo '{"sdk":{"version":"9.0.300","rollForward":"latestPatch"}}' > global.json

      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update

      - name: Build for iOS Simulator
        run: >
          dotnet build Soltec.NET/Soltec.NET.csproj
          --framework net9.0-ios
          -p:RuntimeIdentifier=iossimulator-x64
          -p:CodesignKey=""
          -p:CodesignProvision=""
          --configuration Release
