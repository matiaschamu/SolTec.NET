name: Build iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios

      - name: Restore dependencies
        run: dotnet restore Soltec.NET/Soltec.NET.csproj -f net9.0-ios

      - name: Build for iOS Simulator
        run: >
          dotnet build Soltec.NET/Soltec.NET.csproj
          -f net9.0-ios
          -p:RuntimeIdentifier=iossimulator-x64
          -p:MtouchSimulatorVersion=latest
          -p:CodesignKey=""
          -p:CodesignProvision=""
          --configuration Release
